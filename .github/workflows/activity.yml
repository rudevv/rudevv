name: Refresh public activity
on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
  push:
    paths:
      - scripts/activity.mjs
      - .github/workflows/activity.yml
permissions:
  contents: write
concurrency:
  group: profile-activity
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Refresh public data and graphics
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/activity.mjs
      - name: Save updated profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-*.svg data/activity.json README.md
          if ! git diff --cached --quiet; then
            git commit -m "Refresh public profile activity"
            git push
          fi
